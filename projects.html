<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Jeremy Rice</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <nav aria-label="Main">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html" aria-current="page">Projects</a></li>
    </ul>
  </nav>

  <header>
    <img src="jeremy.jpg" alt="Photo of Jeremy Rice" width="400" height="400">
    <hgroup>
      <h1>Jeremy Rice</h1>
      <p>Marine Corps Veteran turned IT Professional and Digital Marketing Specialist.</p>
    </hgroup>
  </header>

  <main>
    <section id="projects">
      <h2>
        <button type="button" class="section-toggle" aria-expanded="true" aria-controls="projects-content">Projects</button>
      </h2>
      <div id="projects-content">
        <form id="project-form">
          <p>
            <label for="project-name">Project name</label>
            <input type="text" id="project-name" name="project-name" required>
          </p>

          <p>
            <label for="project-description">Description</label>
            <textarea id="project-description" name="project-description" rows="3" required></textarea>
          </p>

          <button type="submit">Add Project</button>
        </form>

        <!-- Cards are rendered here by renderProjects() in profile.js -->
        <ul id="project-list"></ul>
        <p id="project-empty" hidden>No projects yet. Add one above.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Jeremy Rice. All rights reserved.</p>
  </footer>

  <script src="profile.js"></script>
</body>
</html>
