<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeremy Rice | Veteran. Marketer. Technologist.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav aria-label="Main">
    <ul>
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
    </ul>
  </nav>

  <h2 id="greeting"></h2>
  <p id="clock"><time></time></p>

  <header>
    <img src="jeremy.jpg" alt="Photo of Jeremy Rice" width="400" height="400">
    <hgroup>
      <h1>Jeremy Rice</h1>
      <p>Marine Corps Veteran turned IT Professional and Digital Marketing Specialist.</p>
    </hgroup>
  </header>

  <main>
    <section id="contact">
      <h2>
        <button type="button" class="section-toggle" aria-expanded="true" aria-controls="contact-content">Contact</button>
      </h2>
      <div id="contact-content">
        <form>
          <p>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </p>

          <p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </p>

          <p>
            <label for="subject">Subject</label>
            <select id="subject" name="subject">
              <option value="general">General</option>
              <option value="project-inquiry">Project inquiry</option>
              <option value="other">Other</option>
            </select>
          </p>

          <p>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" maxlength="350" placeholder="How can I help you?" aria-describedby="message-count" required></textarea>
            <span id="message-count" class="char-count">0 / 350 characters</span>
          </p>

          <button type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Jeremy Rice. All rights reserved.</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
